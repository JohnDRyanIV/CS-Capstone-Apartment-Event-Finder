<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pocket Mover Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <link href="/public/css/global.css" rel="stylesheet">
    <link href="/public/css/maps.css" rel="stylesheet">
    {% include "bootstrap.html" %}
</head>
<body>
    <header>
        {% include "navbar.html" %}
    </header>

<!-- ── Mobile topbar (hidden on md+) ──────────────────────────────────────── -->
<div id="topbar" class="d-flex d-md-none flex-column px-3 py-2 gap-2 filters-collapsed">

    <!-- Row 1: Segmented layer toggle + filter toggle -->
    <div class="d-flex align-items-stretch gap-2" style="width:100%">
        <div class="layer-seg" style="flex:1">
            <button class="layer-seg-btn active" id="seg-apartments" data-layer="apartments"><span class="dot dot-apt"></span> Apartments</button>
            <button class="layer-seg-btn" id="seg-events" data-layer="events"><span class="dot dot-evt"></span> Events</button>
        </div>
        <button class="filter-toggle-btn" id="filterToggleBtn" aria-label="Toggle filters">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
            </svg>
        </button>
    </div>

    <!-- Row 2: Filters wrapper (animated) -->
    <div id="filters-wrap">

    <!-- Row 2: Filters -->
    <!-- Apartment filters (mobile) -->
    <div id="apt-filters-mobile" class="d-flex flex-column gap-2">
        <div class="layer-seg bed-seg" id="bedFilterMobile">
            <button class="layer-seg-btn active" data-beds="any">Any</button>
            <button class="layer-seg-btn" data-beds="studio">Studio</button>
            <button class="layer-seg-btn" data-beds="1">1</button>
            <button class="layer-seg-btn" data-beds="2">2</button>
            <button class="layer-seg-btn" data-beds="3">3</button>
            <button class="layer-seg-btn" data-beds="4+">4+</button>
        </div>
        <div class="mobile-filter-row">
        <span class="mobile-filter-label">Rent</span>
        <div class="price-range-sliders" style="flex:1;margin:0 4px">
            <div class="price-range-track"></div>
            <div class="price-range-fill" id="priceRangeFillMobile"></div>
            <input type="range" id="priceMinMobile" min="500" max="4000" step="50" value="500">
            <input type="range" id="priceRangeMobile" min="500" max="4000" step="50" value="4000">
        </div>
        <div class="price-labels-stacked">
            <span id="priceMinDisplayMobile">$500</span>
            <span id="priceValueDisplay">$4,000</span>
        </div>
        <input type="hidden" id="priceValueMobile">
        </div>
    </div>

    <!-- Event filters (mobile) -->
    <div id="evt-filters-mobile" class="mobile-filter-row d-none">
        <div class="position-relative">
            <button class="date-range-btn" id="dateRangeBtnMobile">📅 All Dates</button>
            <div class="date-picker-popup" id="datePickerMobile">
                <div class="cal-header">
                    <button class="cal-nav" id="calPrevMobile">‹</button>
                    <span class="cal-month-label" id="calMonthMobile"></span>
                    <button class="cal-nav" id="calNextMobile">›</button>
                </div>
                <div class="cal-weekdays">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div class="cal-grid" id="calGridMobile"></div>
                <div class="cal-selection" id="calSelectionMobile">Select start date</div>
                <div class="date-picker-actions">
                    <button class="date-clear-btn" id="dateClearMobile">Clear</button>
                    <button class="date-apply-btn" id="dateApplyMobile">Apply</button>
                </div>
                <input type="hidden" id="eventStartDateMobile">
                <input type="hidden" id="eventEndDateMobile">
            </div>
        </div>
        <div class="custom-select-wrap" id="catFilterWrapMobile">
            <button class="custom-select-btn" id="catFilterBtnMobile">All Categories</button>
            <ul class="custom-select-list" id="catFilterListMobile"></ul>
        </div>
        <input type="hidden" id="eventCategoryFilterMobile">
    </div>
    </div>
</div>

<!-- ── Main content (map + sidebar) ───────────────────────────────────────── -->
<div id="main-content">

    <!-- Desktop floating controls (hidden on mobile) -->
    <div id="desktop-controls" class="d-none d-md-flex flex-column gap-2">
        <div class="layer-seg desktop-layer-seg">
            <button class="layer-seg-btn active" data-layer="apartments"><span class="dot dot-apt"></span> Apartments</button>
            <button class="layer-seg-btn" data-layer="events"><span class="dot dot-evt"></span> Events</button>
        </div>

        <div id="apt-filters-desktop" class="d-flex flex-column gap-1 pt-2 border-top">
            <strong class="small">Beds</strong>
            <div class="layer-seg bed-seg" id="bedFilterDesktop">
                <button class="layer-seg-btn active" data-beds="any">Any</button>
                <button class="layer-seg-btn" data-beds="studio">Studio</button>
                <button class="layer-seg-btn" data-beds="1">1</button>
                <button class="layer-seg-btn" data-beds="2">2</button>
                <button class="layer-seg-btn" data-beds="3">3</button>
                <button class="layer-seg-btn" data-beds="4+">4+</button>
            </div>
            <strong class="small mt-1">Rent</strong>
            <div class="price-range-wrap">
                <div class="price-range-labels">
                    <span id="priceMinDisplay">$500</span>
                    <span id="priceMaxDisplay">$4,000</span>
                </div>
                <div class="price-range-sliders">
                    <div class="price-range-track"></div>
                    <div class="price-range-fill" id="priceRangeFill"></div>
                    <input type="range" id="priceMin" min="500" max="4000" step="50" value="500">
                    <input type="range" id="priceRange" min="500" max="4000" step="50" value="4000">
                </div>
            </div>
            <input type="hidden" id="priceValue">
        </div>

        <div id="evt-filters-desktop" class="d-none flex-column gap-1 pt-2 border-top">
            <strong class="small">Event Filters</strong>
            <div class="position-relative">
                <button class="date-range-btn" id="dateRangeBtnDesktop">📅 All Dates</button>
                <div class="date-picker-popup" id="datePickerDesktop">
                    <div class="cal-header">
                        <button class="cal-nav" id="calPrevDesktop">‹</button>
                        <span class="cal-month-label" id="calMonthDesktop"></span>
                        <button class="cal-nav" id="calNextDesktop">›</button>
                    </div>
                    <div class="cal-weekdays">
                        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                    </div>
                    <div class="cal-grid" id="calGridDesktop"></div>
                    <div class="cal-selection" id="calSelectionDesktop">Select start date</div>
                    <div class="date-picker-actions">
                        <button class="date-clear-btn" id="dateClearDesktop">Clear</button>
                        <button class="date-apply-btn" id="dateApplyDesktop">Apply</button>
                    </div>
                    <input type="hidden" id="eventStartDate">
                    <input type="hidden" id="eventEndDate">
                </div>
            </div>
            <div class="custom-select-wrap" id="catFilterWrapDesktop">
                <button class="custom-select-btn" id="catFilterBtnDesktop">All Categories</button>
                <ul class="custom-select-list" id="catFilterListDesktop"></ul>
            </div>
            <input type="hidden" id="eventCategoryFilter">
        </div>
    </div>

    <div id="map"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="collapsed">
        <button id="sidebar-toggle" aria-label="Toggle sidebar">▲ Show List</button>
        <div id="sidebar-header" class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom flex-shrink-0">
            <div>
                <h2 id="sidebar-title" class="mb-0">Apartments</h2>
                <div id="sidebar-count" class="text-muted small"></div>
            </div>
        </div>
        <div id="sidebar-list"></div>
    </div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.MAPBOX_TOKEN = "{{ mapbox_token }}";
    window.IS_LOGGED_IN = {{ is_logged_in | tojson }};
    console.log("IS_LOGGED_IN:", window.IS_LOGGED_IN);
</script>
<script src="/public/js/maps.js"></script>
</body>
</html>
